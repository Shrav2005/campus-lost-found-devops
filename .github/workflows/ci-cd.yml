
name: Campus Lost and Found CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/shrav2005/campus-lost-found

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required application files
        run: |
          test -f app/index.html
          test -f app/style.css
          test -f app/script.js
          test -f app/Dockerfile

      - name: Build Docker image
        run: docker build -t campus-lost-found:ci ./app

      - name: Start application container
        run: docker run -d --name campus-lost-found-test -p 8080:80 campus-lost-found:ci

      - name: Test application HTTP response
        run: |
          for i in $(seq 1 15); do
            if curl --fail http://localhost:8080/ -o /dev/null; then
              echo "Application HTTP test passed"
              exit 0
            fi
            sleep 2
          done
          docker logs campus-lost-found-test
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm -f campus-lost-found-test || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/shrav2005/campus-lost-found:latest
            ghcr.io/shrav2005/campus-lost-found:${{ github.sha }}
  deploy:
    needs: build-test-publish
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: read

    steps:
      - name: Pull latest Docker image
        shell: powershell
        run: |
          docker pull ghcr.io/shrav2005/campus-lost-found:latest

      - name: Replace running application
        shell: powershell
        run: |
          docker rm -f campus-lost-found-ghcr
          docker run -d --name campus-lost-found-ghcr --network campus-lost-found_default -p 8082:80 --restart unless-stopped ghcr.io/shrav2005/campus-lost-found:latest

      - name: Verify deployment
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          Invoke-WebRequest http://localhost:8082/ -UseBasicParsing